[project]
name = "action-conditioned-gui-agent"
version = "0.0.1"
description = "Action-Type-Conditioned Grounding for GUI Agents (CS 231N, Spring 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Aadi Chauhan" },
    { name = "Arthur Ilyasov" },
    { name = "Nevin Kunampuram" },
]

dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "peft>=0.13",
    "accelerate>=0.34",
    "datasets>=2.21",
    "pillow>=10",
    "qwen-vl-utils>=0.0.8",
    "wandb>=0.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
